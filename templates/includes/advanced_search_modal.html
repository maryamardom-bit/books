{% load i18n %}
<div x-show="searchOpen" x-cloak class="fixed inset-0 z-[80]" role="dialog" aria-modal="true" aria-labelledby="advanced-search-title">
    <div class="absolute inset-0 bg-ink/40" @click="searchOpen = false"></div>
    <div class="absolute inset-x-3 bottom-3 top-auto flex max-h-[90vh] flex-col rounded-2xl border border-line bg-paper shadow-xl md:inset-auto md:bottom-auto md:left-1/2 md:top-[12vh] md:w-[min(36rem,92vw)] md:-translate-x-1/2"
         @click.stop
         x-transition.opacity>
        <div class="flex items-center justify-between gap-3 border-b border-line px-5 py-4">
            <h2 id="advanced-search-title" class="text-lg">{% trans 'Advanced search' %}</h2>
            <button type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-line" @click="searchOpen = false" aria-label="{% trans 'Close' %}">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form action="{% url 'product:product_search' %}" method="get" class="flex min-h-0 flex-1 flex-col">
            <input type="hidden" name="mode" value="advanced">
            <div class="space-y-4 overflow-y-auto px-5 py-4">
                <div>
                    <label for="advanced-q">{% trans 'Search terms' %}</label>
                    <input id="advanced-q" type="search" name="q" x-model="searchQuery" placeholder="{% trans 'For example, architecture' %}">
                </div>
                <fieldset>
                    <legend class="mb-3 text-xs font-bold text-ink">{% trans 'Search in' %}</legend>
                    <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
                        {% for field in book_search_fields %}
                        <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-line px-3 py-2.5 text-sm font-normal hover:border-accent hover:bg-surface">
                            <input type="checkbox" name="fields" value="{{ field.name }}" class="h-4 w-4 shrink-0 accent-accent"
                                   {% if field.name in selected_fields %}checked{% endif %}>
                            <span>{{ field.label }}</span>
                        </label>
                        {% empty %}
                        <p class="text-sm text-muted">{% trans 'No searchable fields' %}</p>
                        {% endfor %}
                    </div>
                </fieldset>
            </div>
            <div class="border-t border-line p-4">
                <button type="submit" class="btn btn-accent btn-block">{% trans 'Search' %}</button>
            </div>
        </form>
    </div>
</div>
