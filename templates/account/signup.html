{% extends '_base.html' %}
{% load crispy_forms_tags %}
{% load i18n %}
{% block page_title %}
  Sign Up
{% endblock %}

{% block content %}
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm mt-5">
          <div class="card-body p-4 text-center">  <!-- text-center به card-body اضافه شد -->
            <h2 class="mb-4">Sign Up</h2>
            <form action="" method="post" class="text-start">  <!-- text-start به فرم اضافه شد -->
              {% csrf_token %}
              {{ form|crispy }}
              <div class="d-grid gap-2 mt-3">  <!-- d-grid برای دکمه تمام عرض -->
                <button type="submit" class="btn btn-primary btn-lg">{% trans "Sign Up" %}</button>  <!-- input به button تبدیل شد -->
              </div>
            </form>
            <div class="mt-3">
              <small>{% trans "Already have an account?" %} <a href="{% url 'account_login' %}">{% trans "Login" %}</a></small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
