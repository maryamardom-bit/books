{% load static %}
{% load i18n %}

<style>
    /* ===== استایل منوی فوتر بدون خط جداکننده ===== */
    .footer-menu {
        display: flex;
        justify-content: center;
        list-style: none;
        padding: 0;
        margin: 0;
        gap: 20px;
    }
    
    .footer-menu li {
        display: inline-block;
    }
    
    /* حذف کامل border-right */
    .footer-menu li:not(:last-child) {
        border-right: none !important;
        padding-right: 0 !important;
        margin-right: 0 !important;
    }
    
    /* حذف ::after اگر وجود دارد */
    .footer-menu li::after {
        content: none !important;
        display: none !important;
    }
    
    .footer-menu a {
        text-decoration: none;
        color: #555;
        font-size: 14px;
        transition: color 0.3s ease;
    }
    
    .footer-menu a:hover {
        color: #f5c842;
    }
</style>

<!-- Footer Start-->
<footer class="footer">
    <div class="footer-top bg-color ptb--50" data-bg-color="#f6f6f6">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9 text-center">
                    <div class="footer-widget mb--50 pb--1">
                        <ul class="footer-menu">
                            <li><a href="{% url 'aboutus' %}">{% trans "About Us" %}</a></li>
                            <li><a href="{% url 'contactus' %}">{% trans "Contact Us" %}</a></li>
                        </ul>
                        <div class="footer-widget">
                            kasrapublishing.ir
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</footer>
<!-- Footer End-->
