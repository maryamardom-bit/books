{% load i18n %}

<div class="fixed bottom-6 end-6 z-[80]">
    <button type="button" class="relative flex h-14 w-14 items-center justify-center rounded-full bg-ink text-xl text-paper shadow-lg hover:bg-accent" @click="chatOpen = !chatOpen" aria-label="{% trans 'Support chat' %}">
        <i class="fas" :class="chatOpen ? 'fa-times' : 'fa-comments'"></i>
        <span class="absolute top-1 end-1 h-3 w-3 rounded-full border-2 border-paper bg-success"></span>
    </button>
</div>

<div x-show="chatOpen" x-cloak x-transition
     class="fixed bottom-24 end-6 z-[81] flex w-80 max-w-[calc(100vw-2rem)] flex-col overflow-hidden rounded-2xl border border-line bg-paper shadow-xl">
    <div class="flex items-center justify-between bg-ink px-5 py-4 text-paper">
        <div>
            <p class="text-sm font-bold">{% trans 'Support' %}</p>
            <p class="text-[11px] text-success">{% trans 'Online' %}</p>
        </div>
        <button type="button" @click="chatOpen = false" aria-label="{% trans 'Close' %}">✕</button>
    </div>
    <div class="space-y-2 bg-surface p-4 text-sm">
        <p class="rounded-xl bg-paper p-3 shadow-sm">{% trans 'Hello! How can I help?' %}</p>
        <p class="text-xs text-muted">{% trans 'Contact support: 051-37670019' %}</p>
        <a href="{% url 'page:contactus' %}" class="inline-flex rounded-full bg-accent px-4 py-2 text-xs font-bold text-white">{% trans 'Contact Us' %}</a>
    </div>
</div>
