{% load i18n %}

<div class="chat-launcher">
    <button type="button" class="chat-launcher__btn" id="chatToggleBtn" aria-label="{% trans 'Support chat' %}">
        <i id="chatIconBtn" class="fas fa-comments"></i>
        <span class="chat-launcher__status"></span>
    </button>
</div>

<div id="chatPanelBox" class="chat-panel">
    <div class="chat-panel__head">
        <div class="flex items-center gap-2">
            <i class="fas fa-robot text-accent"></i>
            <div>
                <div class="text-sm font-bold">{% trans 'Support' %}</div>
                <div class="text-[11px] text-success"><i class="fas fa-circle text-[8px]"></i> {% trans 'Online' %}</div>
            </div>
        </div>
        <button type="button" class="text-paper" id="chatCloseBtn" aria-label="{% trans 'Close' %}">✕</button>
    </div>
    <div id="chatMsgArea" class="chat-panel__msgs">
        <div class="msg msg--bot">
            <span class="text-lg"><i class="fas fa-robot"></i></span>
            <div class="msg__bubble">{% trans 'Hello! How can I help?' %}</div>
        </div>
        <div id="initialQuestions" class="quick-questions">
            <span class="tag cursor-pointer" data-topic="delivery">🚚 {% trans 'Delivery' %}</span>
            <span class="tag cursor-pointer" data-topic="payment">💳 {% trans 'Payment' %}</span>
            <span class="tag cursor-pointer" data-topic="order">📦 {% trans 'Order' %}</span>
            <span class="tag cursor-pointer" data-topic="return">🔄 {% trans 'Return' %}</span>
        </div>
    </div>
    <div class="chat-panel__inputbar">
        <input type="text" id="chatInputField" placeholder="{% trans 'Type here...' %}" class="input py-2">
        <button type="button" id="chatSendBtn" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-accent text-white" aria-label="{% trans 'Send' %}">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>
